<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../flowers.png" type="image/x-icon" />
  <title>Milo j - Morocha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <audio id="musicPlayer" autoplay loop>
        <source src="Morocha.mp3" type="audio/mp3">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <canvas id="canvas"></canvas>

    <!-- Elementos gráficos de fondo: Mini Polaroids ambientales inspiradas en la portada -->
    <div class="polaroid-gallery" id="polaroidGallery">
        <div class="bg-polaroid p1">
            <div class="tape"></div>
            <div class="img-box">
                <img src="morocha.jpg" alt="Morocha vibe 1">
            </div>
        </div>
        <div class="bg-polaroid p2">
            <div class="tape"></div>
            <div class="img-box">
                <img src="morocha.jpg" alt="Morocha vibe 2">
            </div>
        </div>
        <div class="bg-polaroid p3">
            <div class="tape"></div>
            <div class="img-box">
                <img src="morocha.jpg" alt="Morocha vibe 3">
            </div>
        </div>
        <div class="bg-polaroid p4">
            <div class="tape"></div>
            <div class="img-box">
                <img src="morocha.jpg" alt="Morocha vibe 4">
            </div>
        </div>
    </div>

    <!-- Reproductor Principal -->
    <main class="main">
        <div class="reproductor">
            <span class="status-tag">Yo si recuerdo la primera canción</span>
            
            <div class="polaroid-main">
                <div class="disc">
                    <img src="morocha.jpg" alt="Milo j - Morocha Cover">
                </div>
            </div>

            <div class="info">
                <h1>MOROCHA</h1>
                <p>Milo j</p>
            </div>

            <button id="playPauseBtn" class="control-btn" aria-label="Reproducir o pausar">
                <svg class="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg class="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
