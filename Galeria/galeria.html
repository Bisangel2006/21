<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuestros Momentos 📸 | 21 de Septiembre</title>

  <link rel="icon" href="../flowers.png" type="image/x-icon" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="galeria.css" />
</head>
<body>

  <!-- Luciérnagas de fondo -->
  <div id="glow-container"></div>

  <div class="gallery-wrapper">
    
    <!-- Encabezado -->
    <header class="gallery-header">
      <a href="../index.html" class="btn-back">&larr; Volver al inicio</a>
      <span class="badge">🌻 21</span>
      <h1>Mini galeria :p</h1>
      <p class="subtitle">
        JAJAJAJA me arrepiento de no haber tomado ft el dia del churro
      </p>
              <span class="highlight">tuktan mairin nais</span>
    </header>

    <!-- Cuadrícula de Fotos -->
    <main class="gallery-grid">
      <!-- Foto 1 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/espaldas.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">A donde sea, pero a la par tuya</figcaption>
      </figure>

      <!-- Foto 2 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/risa.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">El paisaje más bonito es verte sonreír</figcaption>
      </figure>

      <!-- Foto 3 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/juntos.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">Mi lugar favorito es donde estemos cerquita</figcaption>
      </figure>

      <!-- Foto 4 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/camera.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">Mi fotógrafa favorita</figcaption>
      </figure>

      <!-- Foto 5 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/manos.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">Donde no den tus fuerzas, entran las mías</figcaption>
      </figure>

      <!-- Foto 6 -->
      <figure class="gallery-item">
        <div class="img-frame">
          <img src="img/flores.jpg" alt="Recuerdo especial" loading="lazy" />
        </div>
        <figcaption class="caption">La flor más bonita esta detrás del ramo</figcaption>
      </figure>
    </main>

  <!-- Modal / Lightbox para ver la imagen en grande -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="Vista ampliada" />
      <p id="lightbox-caption"></p>
    </div>
  </div>

  <script src="galeria.js"></script>
</body>
</html>
